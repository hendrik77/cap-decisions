name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Node ${{ matrix.node }}, CAP ${{ matrix.cds }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CDS_TEST_ENV_CHECK: y
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        cds: [9, 10]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.cds == 9
        run: npm install --no-save @sap/cds@^9 @sap/cds-dk@^9
      - run: npm run lint
      - if: matrix.cds == 10
        run: npm run typecheck
      - if: matrix.node != 24 || matrix.cds != 10
        run: npm test
      - if: matrix.node == 24 && matrix.cds == 10
        run: npm run coverage
      - run: npm pack --dry-run
